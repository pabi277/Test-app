# SPDX-License-Identifier: MIT
# Copy to .github/workflows/ci-build.yml in the app repository.
# Assumes an Android app module named `app` and a Gradle wrapper at repo root.
# Every push — every phase on any branch — runs tests and uploads a
# downloadable debug APK artifact (`app-progress-apk`): the owner sideloads it
# to SEE the phase's increment. It is progress, not a release. Signed release
# artifacts build on main only.
# Release signing config must read ANDROID_KEYSTORE_PATH plus the four secret
# environment variables below in Gradle; fail release builds if they are absent.
# Configure these GitHub Actions secrets; never commit their values:
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD.
name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests, debug build, progress APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Accept Android SDK licenses
        run: |
          set -eu
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK_ROOT/licenses"
          printf '\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' >> "$SDK_ROOT/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' >> "$SDK_ROOT/licenses/android-sdk-preview-license"
      - name: Run unit tests and build debug APK
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee build-log.txt
      - name: Build the release variant for device QA
        # QA only: with no keystore secrets this is debug-signed, and the ad
        # units are the committed TEST ones. Signed, upload-grade artifacts are
        # built by the main-only job below. Having the release variant here means
        # every phase can be reviewed on the same build type that will ship.
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee -a build-log.txt
      - name: Check publish invariants in the release APK
        # Fails the run when the release variant requests a permission the
        # product promises never to use (law 5: zero location/personal-data
        # collection, no broad storage access) or when an ad unit other than a
        # placeholder or Google's test unit is compiled into a build that was
        # not given one through protected configuration. Findings are emitted as
        # check annotations (log downloads resolve to an unreachable host here).
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import glob, os, re, struct, subprocess, sys

          apk_files = sorted(glob.glob('app/build/outputs/apk/release/*.apk'))
          if not apk_files:
              print('::error title=release APK::assembleRelease produced no APK')
              sys.exit(1)
          apk = apk_files[0]
          size = os.path.getsize(apk)
          print(f'release APK: {apk} ({size} bytes)')

          def annotate(kind, title, body):
              body = str(body).replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f'::{kind} title={title}::{body[:900]}')

          badging = ''
          sdk_root = os.environ.get('ANDROID_HOME') or '/usr/local/lib/android/sdk'
          tools = sorted(glob.glob(os.path.join(sdk_root, 'build-tools', '*', 'aapt2')))
          if tools:
              badging = subprocess.run([tools[-1], 'dump', 'badging', apk],
                                       capture_output=True, text=True).stdout
          else:
              annotate('warning', 'aapt2 missing', 'aapt2 was not found; badging evidence unavailable')

          permissions = re.findall(r"uses-permission(?:-sdk-\d+)?: name='([^']+)'", badging)
          annotate('notice', 'aapt2 badging head', ' / '.join(badging.splitlines()[:6]))

          def group(pattern, default='?'):
              match = re.search(pattern, badging)
              return match.group(1) if match else default
          package_name = group(r"package: name='([^']+)'")
          version_code = group(r"versionCode='([^']+)'")
          version_name = group(r"versionName='([^']+)'")
          min_sdk = group(r"(?:min)?[Ss]dkVersion:'(\d+)'")
          target_sdk = group(r"targetSdkVersion:'(\d+)'")
          annotate('notice', 'release APK identity',
                   f'package {package_name} | versionCode {version_code} | versionName {version_name}'
                   f' | minSdk {min_sdk} | targetSdk {target_sdk} | {size} bytes')

          annotate('notice', 'release APK permissions', ', '.join(sorted(permissions)) or 'none declared')

          # Permissions the product promises never to request. Location, contacts,
          # camera, microphone, phone, SMS, storage, media, calendar and sensors
          # are all banned outright; anything else unexpected is a warning.
          BANNED = {
              'android.permission.ACCESS_FINE_LOCATION', 'android.permission.ACCESS_COARSE_LOCATION',
              'android.permission.ACCESS_BACKGROUND_LOCATION', 'android.permission.READ_CONTACTS',
              'android.permission.WRITE_CONTACTS', 'android.permission.GET_ACCOUNTS',
              'android.permission.CAMERA', 'android.permission.RECORD_AUDIO',
              'android.permission.READ_PHONE_STATE', 'android.permission.READ_PHONE_NUMBERS',
              'android.permission.CALL_PHONE', 'android.permission.READ_SMS',
              'android.permission.RECEIVE_SMS', 'android.permission.READ_EXTERNAL_STORAGE',
              'android.permission.WRITE_EXTERNAL_STORAGE', 'android.permission.MANAGE_EXTERNAL_STORAGE',
              'android.permission.QUERY_ALL_PACKAGES', 'android.permission.READ_MEDIA_IMAGES',
              'android.permission.READ_MEDIA_VIDEO', 'android.permission.READ_MEDIA_AUDIO',
              'android.permission.BODY_SENSORS', 'android.permission.ACTIVITY_RECOGNITION',
              'android.permission.READ_CALENDAR', 'android.permission.WRITE_CALENDAR',
              'android.permission.NEARBY_WIFI_DEVICES', 'android.permission.BLUETOOTH_SCAN',
              'android.permission.BLUETOOTH_CONNECT', 'android.permission.BLUETOOTH_ADVERTISE',
          }
          # Declared by the SDKs in the release build, reviewed in
          # docs/play/data-safety.md: ads network access, the ads Privacy Sandbox
          # services, Play Billing, and AndroidX's own receiver permission.
          EXPECTED = {
              'android.permission.INTERNET', 'android.permission.ACCESS_NETWORK_STATE',
              'com.google.android.gms.permission.AD_ID', 'com.android.vending.BILLING',
              'android.permission.ACCESS_ADSERVICES_AD_ID',
              'android.permission.ACCESS_ADSERVICES_ATTRIBUTION',
              'android.permission.ACCESS_ADSERVICES_TOPICS',
              'android.permission.FOREGROUND_SERVICE', 'android.permission.WAKE_LOCK',
              'com.pabicalc.paisacalc.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION',
          }
          violations = sorted(set(permissions) & BANNED)
          if violations:
              annotate('error', 'banned permission in release APK', ', '.join(violations))
              sys.exit(1)
          unexpected = sorted(p for p in permissions if p not in EXPECTED and p not in BANNED)
          if unexpected:
              annotate('warning', 'unexpected permission (review)', ', '.join(unexpected))

          # Ad units compiled into the build. Google's test publisher is expected;
          # an all-zero publisher is the placeholder SDKs and docs ship; anything
          # else is a live unit and must come from protected configuration.
          TEST_PUBLISHER = 'ca-app-pub-3940256099942544'
          workdir = subprocess.run(['mktemp', '-d'], capture_output=True, text=True).stdout.strip()
          subprocess.run(['unzip', '-q', '-o', apk, '-d', workdir], check=False)
          pattern = re.compile(rb'ca-app-pub-\d{16}[~/]\d{10}')
          found = {}
          for root, _dirs, files in os.walk(workdir):
              for name in files:
                  path = os.path.join(root, name)
                  with open(path, 'rb') as handle:
                      for unit in pattern.findall(handle.read()):
                          found.setdefault(unit.decode(), set()).add(
                              os.path.relpath(path, workdir))
          units = sorted(found)
          annotate('notice', 'ad units in release APK',
                   '; '.join(f'{unit} [{", ".join(sorted(found[unit]))}]' for unit in units) or 'none found')

          def dependency_owners(needle):
              """Which cached dependency ships [needle]? Scans the Gradle module cache
              (bounded to the SDK families this app uses) through nested zips."""
              import io, zipfile
              cache = os.environ.get('GRADLE_USER_HOME') or os.path.expanduser('~/.gradle')
              modules = os.path.join(cache, 'caches', 'modules-2', 'files-2.1')
              interesting = ('play-services-ads', 'user-messaging-platform', 'billingclient')
              target = needle.encode()
              owners = []
              for root, _dirs, files in os.walk(modules):
                  for name in files:
                      full = os.path.join(root, name)
                      if not name.endswith(('.aar', '.jar')) or not any(k in full for k in interesting):
                          continue
                      try:
                          with zipfile.ZipFile(full) as outer:
                              inner_names = [n for n in outer.namelist() if n.endswith('.jar')] or ['']
                              for inner_name in inner_names:
                                  payload = outer.read(inner_name) if inner_name else None
                                  if payload is None:
                                      continue
                                  with zipfile.ZipFile(io.BytesIO(payload)) as inner:
                                      for entry in inner.namelist():
                                          if target in inner.read(entry):
                                              coordinates = full.split(os.sep + 'files-2.1' + os.sep)[-1]
                                              owners.append(os.sep.join(coordinates.split(os.sep)[:3]) + f'!{inner_name}!{entry}')
                      except Exception:
                          continue
              return sorted(set(owners))

          unknown = [u for u in units if not u.startswith(TEST_PUBLISHER)]
          placeholders = [u for u in unknown if u.split('~')[0].split('/')[0] == 'ca-app-pub-0000000000000000']
          live = [u for u in unknown if u not in placeholders and not u.startswith('ca-app-pub-0000')]
          if placeholders:
              annotate('notice', 'placeholder ad id (SDK-provided, not configured)',
                       ', '.join(placeholders) + ' — all-zero publisher placeholders cannot serve ads')
          if live:
              annotate('error', 'non-test ad unit without protected configuration',
                       ', '.join(live) + ' — live units must come from -Ppaisacalc.rewardedAdUnitId')
              sys.exit(1)
          for concern in unknown:
              owners = dependency_owners(concern)
              annotate('notice', f'dependency shipping {concern}',
                       (', '.join(owners[:5]) + (f' (+{len(owners) - 5} more)' if len(owners) > 5 else ''))
                       or 'not found in the cached dependencies')
          if units:
              annotate('notice', 'ad unit policy',
                       'test publisher + SDK placeholders only in this build')
          PY

      - name: Upload release APK for device QA (debug-signed, QA only)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-qa-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Surface the failure in check annotations
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import re

          try:
              text = open('build-log.txt', errors='replace').read()
          except OSError:
              print('::error title=CI failure::no build-log.txt was produced')
              raise SystemExit(0)

          text = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', text)
          lines = text.splitlines()
          hits = [i for i, line in enumerate(lines) if re.match(r'^(e: |.*error:|.*FAILED|.*What went wrong)', line)]

          def emit(title, body):
              body = body.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f'::error title={title}::{body[:950]}')

          for i in hits[:4]:
              emit('kotlin/build error', lines[i])

          if hits:
              start = max(0, hits[0] - 2)
          else:
              start = max(0, len(lines) - 120)
          region = '\n'.join(lines[start:start + 140])[-5000:]
          for n in range(0, min(len(region), 5400), 900):
              emit('build log', region[n:n + 900])
          print(f'::notice title=build log size::{len(lines)} lines')
          PY
      - name: Upload build log and test reports (diagnostics on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            build-log.txt
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: warn
          retention-days: 7
      - name: Upload progress APK (the downloadable result of this phase)
        uses: actions/upload-artifact@v4
        with:
          name: app-progress-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  signed-release:
    name: Signed release AAB and APK
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Accept Android SDK licenses
        run: |
          set -eu
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK_ROOT/licenses"
          printf '\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' >> "$SDK_ROOT/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' >> "$SDK_ROOT/licenses/android-sdk-preview-license"
      - name: Prepare signing key on runner
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required Actions secret: $name"
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/release-upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Build signed release AAB and APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease
      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-android-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
